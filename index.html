
<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jitendra_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jitendra_portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Full-screen gradient background */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #040C26, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Loader container */
    #initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }

    /* Circle spinner */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

</head>
<body>

<!-- Initial Loader UI -->
<div id="initial-loader">
  <div class="spinner"></div>
  <div>Loading portfolio…</div>
</div>

<!-- Flutter app loader -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5HJWWTWFNL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-5HJWWTWFNL');
</script>
<script>
  // Hide loader when flutter fully loads
  window.addEventListener('flutter-first-frame', function () {
    const loader = document.getElementById('initial-loader');
    if (loader) loader.style.display = 'none';
    // Allow Flutter to take full control
    document.body.style.overflow = 'auto';
  });
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
